
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sam's Journal</title>

  <style>

    :root {
      --cream: #F5F0E5;
      --brown: #493528;
      --pink: #E8A9B5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--brown);
      font-family: Georgia, serif;
    }

    /* NAVIGATION */

    nav {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 85px;
      background: var(--cream);

      display: grid;
      grid-template-columns:
        1fr 1.2fr 1fr 1.3fr 1fr 65px;

      align-items: center;
      gap: 12px;
      padding: 12px 35px;
    }

    nav a {
      color: var(--brown);
      text-decoration: none;
      text-align: center;
      font-size: 12px;
      letter-spacing: 1px;
      line-height: 1.5;
      transition: opacity 0.3s ease;
    }

    nav a:hover {
      opacity: 0.6;
    }

    /* PLUMERIA */

    .flower-link {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 50px;
      height: 50px;
      justify-self: center;
      transition: transform 0.3s ease;
    }

    .flower-link:hover {
      transform: rotate(15deg) scale(1.1);
      opacity: 1;
    }

    .flower-link svg {
      width: 43px;
      height: 43px;
    }

    /* CONTINUOUS PHOTO STORY */

    .photo-story {
      position: relative;
      height: 300vh;
      height: 300svh;
    }

    /* ONE PHOTO, NEVER REPEATED */

    .photo-background {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100svh;
      width: 100%;
      overflow: hidden;
      background: #493528;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .photo-background img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* SLIGHT DARK OVERLAY FOR READABILITY */

    .photo-background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    /* TEXT SCROLLS OVER THE SINGLE PHOTO */

    .story-writing {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 2;
    }

    .story-sentence {
      height: 100vh;
      height: 100svh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 70px 10%;
      text-align: center;
    }

    .story-sentence p {
      color: var(--cream);
      font-size: clamp(28px, 4vw, 58px);
      font-weight: normal;
      font-style: italic;
      line-height: 1.5;
      max-width: 900px;
      margin: 0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }

    /* ABOUT */

    .about {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 650px;
      background: var(--cream);
    }

    .about-photo {
      width: 100%;
      height: 100%;
      min-height: 650px;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .about-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 70px 12%;
      color: var(--brown);
    }

    .about-text h2 {
      font-size: clamp(30px, 3vw, 48px);
      font-weight: normal;
      font-style: italic;
      margin: 0 0 25px;
    }

    .about-text p {
      font-size: 17px;
      line-height: 1.9;
      margin: 0 0 20px;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      nav {
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        padding: 15px 10px;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 0.5px;
      }

      .flower-link {
        width: 42px;
        height: 42px;
      }

      .flower-link svg {
        width: 38px;
        height: 38px;
      }

      .story-sentence {
        padding: 60px 8%;
      }

      .story-sentence p {
        font-size: clamp(24px, 6vw, 36px);
      }

      .about {
        grid-template-columns: 1fr;
      }

      .about-photo {
        height: 420px;
        min-height: 0;
      }

      .about-text {
        padding: 60px 30px;
      }

      .about-text h2 {
        font-size: 32px;
      }

      .about-text p {
        font-size: 16px;
      }
    }

  </style>
</head>
